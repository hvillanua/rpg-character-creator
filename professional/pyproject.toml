[project]
name = "rpg-character-creator"
version = "0.1.0"
description = "A small RPG character creator demonstrating production-style Python design"
requires-python = ">=3.11"

[project.optional-dependencies]
test = ["pytest>=8,<9"]

[project.scripts]
rpg-character-creator = "character_creator.main:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.pytest.ini_options]
testpaths = ["tests"]
